name: CI (CPU — masques, curriculum, perte)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers accelerate pytest
          pip install -e .
      - name: Run CPU tests (masques, curriculum, perte)
        run: |
          python -m pytest tests/unit/test_curriculum.py \
                         tests/numerical/test_loss.py \
                         tests/numerical/test_masks.py \
                         --tb=short -v
