name: CPU tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU only, no model weights)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers safetensors pytest pyyaml
      - name: Unit + toy numerical tests (no GPU, no weights)
        run: |
          python -m pytest tests/unit/test_curriculum.py tests/unit/test_master.py tests/unit/test_sampler.py tests/unit/test_train_step.py tests/integration/test_checkpoint.py tests/numerical/test_masks.py tests/numerical/test_loss.py -q
